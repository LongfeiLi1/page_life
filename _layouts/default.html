            renderMathInElement(document.body, {
              delimiters: [
                  {left: '$$', right: '$$', display: true},
                  {left: '$', right: '$', display: false}
              ],
              throwOnError : false
            });
        });

    <!-- Certificate Lightbox -->
    <style>
      .cert-lightbox-overlay {
        display: none; position: fixed; inset: 0;
        background: rgba(0,0,0,0.85); z-index: 9999;
        align-items: center; justify-content: center; cursor: zoom-out;
      }
      .cert-lightbox-overlay.active { display: flex; animation: certFadeIn .18s ease; }
      @keyframes certFadeIn { from { opacity:0; } to { opacity:1; } }
      .cert-lightbox-img {
        max-width: 90vw; max-height: 88vh;
        border-radius: 4px; box-shadow: 0 12px 60px rgba(0,0,0,0.5); cursor: default;
      }
      .cert-lightbox-close {
        position: absolute; top: 16px; right: 24px;
        color: rgba(255,255,255,0.85); font-size: 2rem;
        cursor: pointer; background: none; border: none; padding: 0; line-height: 1;
        transition: color .15s;
      }
      .cert-lightbox-close:hover { color: #fff; }
      .cert-badge {
        display: inline-flex; align-items: center; gap: 3px;
        font-size: 0.72rem; font-weight: 500;
        padding: 1px 7px; border-radius: 10px;
        background: #f0f0f0; color: #555; border: 1px solid #ddd;
        text-decoration: none !important; vertical-align: middle; margin-left: 4px;
        transition: background .15s, color .15s; cursor: pointer;
      }
      .cert-badge:hover { background: #e2e2e2; color: #333; text-decoration: none !important; }
    </style>
    <div class="cert-lightbox-overlay" id="certLightbox">
      <button class="cert-lightbox-close" id="certClose" aria-label="Close">&times;</button>
      <img class="cert-lightbox-img" id="certImg" src="" alt="Certificate">
    </div>
    <script>
      (function(){
        var overlay = document.getElementById('certLightbox');
        var img     = document.getElementById('certImg');
        document.addEventListener('click', function(e){
          var el = e.target.closest('[data-cert]');
          if(el){ e.preventDefault(); img.src = el.getAttribute('data-cert'); overlay.classList.add('active'); }
        });
        document.getElementById('certClose').addEventListener('click', function(){ overlay.classList.remove('active'); });
        overlay.addEventListener('click', function(e){ if(e.target===overlay) overlay.classList.remove('active'); });
        document.addEventListener('keydown', function(e){ if(e.key==='Escape') overlay.classList.remove('active'); });
      })();
    </script>
</body>
</html>
