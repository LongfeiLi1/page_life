  <p>
      I am a Master's student in Electronic Information at <a href="https://www.hnu.edu.cn/" target="_blank">Hunan University</a>.
      My research lies at the intersection of <strong>Vision Language Models (VLMs)</strong>
      and <strong>Electronic Design Automation (EDA)</strong>.
  </p>
  <p>
      I received my B.Sc. in Computer Science from <a href="https://www.sylu.edu.cn/" target="_blank">Shenyang Ligong University</a>,
      where I competed in ICPC/CCPC and earned multiple national and regional awards.
      Outside of research, I enjoy landscape and street photography, and cycling.
  </p>

